<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOTD: Translation Trainer & Archives</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* === ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ === */
        :root {
            /* Переменные Тренажера */
            --bg-color: #050505;
            --card-bg: #121212;
            --blood-red: #660000;
            --fire-red: #cc0000;
            --gold: #c5a059;
            --gold-dark: #7a5e25;
            --text: #e0e0e0;
            --scale-color: #1a0505;

            /* Переменные Архивов */
            --paper-bg: #fff5e6; 
            --ink-color: #1a0f00;
            --accent-red: #c90000;
            --accent-gold: #ffb700;
            --hover-bg: rgba(201, 0, 0, 0.1);
        }

        /* === ГЛОБАЛЬНЫЕ СТИЛИ И ФОНЫ === */
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.4s ease;
        }

        /* Тема Тренажера */
        body.trainer-theme {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 100% 150%, var(--scale-color) 24%, rgba(0,0,0,0) 25%),
                radial-gradient(circle at 0% 150%, var(--scale-color) 24%, rgba(0,0,0,0) 25%),
                radial-gradient(circle at 50% 100%, var(--scale-color) 50%, rgba(0,0,0,0) 51%),
                radial-gradient(circle at 100% 50%, var(--scale-color) 24%, rgba(0,0,0,0) 25%),
                radial-gradient(circle at 0% 50%, var(--scale-color) 24%, rgba(0,0,0,0) 25%),
                radial-gradient(circle at 50% 0%, var(--scale-color) 50%, rgba(0,0,0,0) 51%);
            background-size: 60px 60px;
        }

        /* Тема Архивов */
        body.archives-theme {
            background-color: #111;
            background-image: url('https://www.transparenttextures.com/patterns/wood-pattern.png');
        }

        /* === КНОПКА ПЕРЕКЛЮЧЕНИЯ === */
        #global-toggle-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            background: #121212;
            border: 2px solid var(--gold-dark);
            color: var(--gold);
            padding: 12px 24px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.8);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #global-toggle-btn:hover {
            background: var(--blood-red);
            color: #fff;
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(204, 0, 0, 0.6);
            transform: translateY(-2px);
        }

        /* === КОНТЕЙНЕРЫ ВИДОВ === */
        #trainer-view {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Lato', sans-serif;
            color: var(--text);
        }

        #archives-view {
            width: 100%;
            display: none; /* Скрыто по умолчанию */
            justify-content: center;
            align-items: center;
            font-family: 'Cormorant Garamond', serif;
            color: var(--ink-color);
            padding: 40px;
        }

        /* ========================================= */
        /* === СТИЛИ ТРЕНАЖЕРА (БЕЗ ИЗМЕНЕНИЙ) === */
        /* ========================================= */
        .container {
            width: 95%;
            max-width: 800px;
            text-align: center;
            position: relative;
            background: rgba(10, 10, 10, 0.95);
            padding: 2rem;
            border: 2px solid var(--gold-dark);
            border-radius: 4px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 80px rgba(102, 0, 0, 0.1);
        }

        .dragon-sigil {
            width: 100px;
            height: 100px;
            fill: var(--blood-red);
            filter: drop-shadow(0 0 10px var(--fire-red));
            margin-bottom: 1rem;
            transition: transform 0.5s ease;
        }
        
        .container:hover .dragon-sigil { transform: scale(1.05); }

        .trainer-title {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 2.5rem;
            margin: 0 0 1.5rem 0;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            border-bottom: 1px solid var(--gold-dark);
            padding-bottom: 1rem;
        }

        .mode-switch {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .mode-btn {
            background: transparent;
            border: 1px solid var(--gold-dark);
            color: var(--gold-dark);
            padding: 10px 20px;
            font-family: 'Cinzel', serif;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            font-weight: bold;
        }

        .mode-btn.active, .mode-btn:hover {
            background: var(--blood-red);
            color: var(--gold);
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(204, 0, 0, 0.4);
        }

        .stats {
            display: flex;
            justify-content: space-between;
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 1.1rem;
            margin-bottom: 1rem;
            padding: 0 1rem;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--gold-dark);
            padding: 2rem;
            margin-bottom: 2rem;
            position: relative;
        }

        .card::before, .card::after {
            content: "✦";
            position: absolute;
            color: var(--gold);
            font-size: 1.5rem;
        }
        .card::before { top: 10px; left: 10px; }
        .card::after { bottom: 10px; right: 10px; }

        .task-label {
            display: block;
            font-family: 'Cinzel', serif;
            color: var(--fire-red);
            margin-bottom: 1rem;
            font-size: 0.9rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .original-word {
            font-family: 'Cinzel', serif;
            font-size: 2.2rem;
            color: var(--gold);
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 0px rgba(0,0,0,1);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .translation-word {
            font-size: 1.5rem;
            color: var(--text);
            font-style: italic;
            opacity: 0.8;
            margin-bottom: 1rem;
        }

        .feedback {
            height: 1.5rem;
            font-weight: bold;
            font-family: 'Cinzel', serif;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 1rem;
        }

        .option-btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: var(--text);
            padding: 1.2rem;
            cursor: pointer;
            font-family: 'Lato', sans-serif;
            font-size: 1rem;
            text-transform: uppercase;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--gold);
            color: var(--gold);
            background: #252525;
        }

        .option-btn.correct {
            background: #0f3d0f !important;
            border-color: #2e7d32 !important;
            color: #fff !important;
        }

        .option-btn.wrong {
            background: #4a0f0f !important;
            border-color: #c62828 !important;
            color: #fff !important;
        }

        #next-btn {
            width: 100%;
            margin-top: 1.5rem;
            padding: 1rem;
            background: linear-gradient(45deg, var(--gold-dark), var(--gold));
            border: none;
            color: #000;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            display: none;
        }

        #next-btn:hover { filter: brightness(1.2); }

        .speak-btn {
            background: none;
            border: none;
            color: var(--gold);
            font-size: 2rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            line-height: 1;
            padding: 0;
            margin-left: 0.5rem;
        }
        .speak-btn:hover {
            transform: scale(1.2);
            color: var(--fire-red);
        }

        /* Экран завершения */
        #completion-screen {
            display: none;
            background: var(--card-bg);
            border: 1px solid var(--gold-dark);
            padding: 3rem 2rem;
            margin-bottom: 2rem;
            position: relative;
        }
        
        #completion-screen h2 {
            font-family: 'Cinzel', serif;
            color: var(--gold);
            font-size: 2.2rem;
            margin-top: 0;
            text-transform: uppercase;
        }

        #completion-screen p {
            font-size: 1.2rem;
            color: var(--text);
            margin-bottom: 2rem;
        }

        /* ========================================= */
        /* === СТИЛИ АРХИВОВ (БЕЗ ИЗМЕНЕНИЙ) === */
        /* ========================================= */
        .book-container {
            display: flex;
            width: min(1000px, 95vw);
            height: min(700px, 90vh);
            background-color: var(--paper-bg);
            box-shadow: 
                0 0 20px rgba(0,0,0,0.9), 
                0 0 40px rgba(255, 183, 0, 0.1),
                inset 0 0 120px rgba(166, 116, 50, 0.3);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            border: 1px solid #5c4018;
        }

        .book-spine {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 50px;
            background: linear-gradient(90deg, 
                rgba(0,0,0,0.2), 
                rgba(0,0,0,0.05) 20%, 
                rgba(0,0,0,0.05) 80%, 
                rgba(0,0,0,0.2));
            transform: translateX(-50%);
            z-index: 10;
            border-left: 1px solid rgba(0,0,0,0.1);
            border-right: 1px solid rgba(0,0,0,0.1);
        }

        .page {
            flex: 1;
            padding: 50px;
            overflow-y: auto;
        }

        .left-page {
            border-right: 1px solid rgba(0,0,0,0.15);
            padding-right: 70px;
        }

        .right-page {
            padding-left: 70px;
        }

        .archives-title, .archives-subtitle {
            font-family: 'Cinzel', serif;
            text-align: center;
            color: var(--accent-red);
            border-bottom: 3px solid var(--accent-gold);
            padding-bottom: 15px;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 1px 1px 0px rgba(0,0,0,0.1);
        }

        .list-item {
            cursor: pointer;
            padding: 18px;
            border-bottom: 1px solid rgba(184, 134, 11, 0.3);
            transition: all 0.3s;
            font-size: 1.3rem;
            font-weight: 600;
            position: relative;
        }

        .list-item:hover {
            background-color: var(--hover-bg);
            padding-left: 28px;
            color: var(--accent-red);
        }

        .list-item.active {
            font-weight: bold;
            color: #fff;
            background-color: var(--accent-red);
            border-left: 5px solid var(--accent-gold);
            box-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        .detail-card {
            display: none;
            animation: fadeIn 0.4s ease-out;
        }

        .detail-card.visible {
            display: block;
        }

        .prototype-label {
            font-family: 'Cinzel', serif;
            font-size: 1rem;
            text-transform: uppercase;
            color: var(--accent-red);
            margin-top: 25px;
            margin-bottom: 5px;
            display: inline-block;
            font-weight: bold;
            border-bottom: 1px solid var(--accent-gold);
        }

        .translation-box {
            background: #fff;
            padding: 20px;
            border: 2px solid var(--accent-gold);
            margin: 10px 0;
            font-style: italic;
            box-shadow: 3px 3px 0px rgba(0,0,0,0.05);
            font-size: 1.1rem;
        }

        .history-box {
            background: rgba(0,0,0,0.03);
            border: 2px solid var(--ink-color);
            padding: 20px;
            margin-top: 25px;
            position: relative;
        }

        .history-box::before {
            content: "ИСТОРИЧЕСКИЙ ПРОТОТИП";
            position: absolute;
            top: -14px;
            left: 15px;
            background: var(--accent-red);
            color: #fff;
            padding: 2px 12px;
            font-family: 'Cinzel', serif;
            font-weight: bold;
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .history-box p:first-of-type::first-letter {
            float: left;
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            line-height: 0.8;
            padding-right: 10px;
            padding-top: 5px;
            color: var(--accent-red);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        
        .page::-webkit-scrollbar { width: 6px; }
        .page::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        .page::-webkit-scrollbar-thumb { background: var(--accent-red); border-radius: 3px; }
    </style>
</head>
<body class="trainer-theme">

    <button id="global-toggle-btn" onclick="toggleViews()">📚 Открыть Архивы Цитадели</button>

    <div id="trainer-view">
        <div class="container">
            <svg class="dragon-sigil" viewBox="0 0 512 512">
                <path d="M136.8 56.4C118.4 51.5 101.4 43.1 87.2 30.2 73 43.1 56 51.5 37.6 56.4c-17.7 4.7-37.2 6.4-56.1 2.3 12.3 22.1 31.5 39.1 54.4 47.9 22.9 8.8 48.6 8.8 71.5 0 22.9-8.8 42.1-25.8 54.4-47.9-18.9 4.1-38.4 2.4-56.1-2.3zM368 32c-29.5 0-56.2 12-75.3 31.2C273.6 82.3 261.6 109 261.6 138.5c0 29.5 12 56.2 31.2 75.3 19.1 19.1 45.8 31.2 75.3 31.2s56.2-12 75.3-31.2c19.1-19.1 31.2-45.8 31.2-75.3 0-29.5-12-56.2-31.2-75.3C424.2 44 397.5 32 368 32zM427.2 277.6c-21.8-13.4-46.6-20.5-72.2-20.5-38 0-73.4 15.6-98.8 41-1.6 1.6-3.1 3.2-4.6 4.9-20.1-40.3-61.7-67.5-108.6-67.5-67.1 0-121.5 54.4-121.5 121.5 121.5 0 67.1 54.4 121.5 121.5 121.5 50.1 0 93.9-31.1 112.9-75.8 1.9 2.2 3.9 4.3 5.9 6.3 25.4 25.4 60.8 41 98.8 41 25.6 0 50.4-7.1 72.2-20.5 41.7-25.7 67.3-71 67.3-120.3S468.9 303.3 427.2 277.6z"/>
            </svg>

            <h1 class="trainer-title">House of the Dragon<br><span style="font-size: 1.2rem; color: var(--gold-dark)">Translation Trainer</span></h1>

            <div class="mode-switch">
                <button class="mode-btn active" onclick="setMode('transformation', event)">Способ перевода</button>
                <button class="mode-btn" onclick="setMode('category', event)">Тип имени</button>
            </div>

            <div class="stats">
                <span id="score">Счет: 0</span>
                <span id="total">Всего: 0</span>
            </div>

            <div id="game-card" class="card">
                <span id="task-label" class="task-label">Определите трансформацию</span>
                <div id="original" class="original-word">...</div>
                <div id="translation" class="translation-word">...</div>
                <div id="feedback" class="feedback"></div>
            </div>
            <div id="options" class="options-grid"></div>
            <button id="next-btn" onclick="nextQuestion()">Следующий вопрос</button>

            <div id="completion-screen">
                <h2>Тренировка завершена!</h2>
                <p>Вы прошли всю базу данных имён и топонимов Вестероса.</p>
                <div style="font-family: 'Cinzel', serif; color: var(--fire-red); font-size: 1.5rem; margin-bottom: 2rem;">
                    Ваш результат: <span id="final-score">0</span> из <span id="final-total">0</span>
                </div>
                <button class="mode-btn active" onclick="restartTrainer()" style="font-size: 1.2rem; padding: 15px 30px;">Начать заново</button>
            </div>

        </div>
    </div>

    <div id="archives-view">
        <div class="book-container">
            <div class="book-spine"></div>
            
            <div class="page left-page">
                <h1 class="archives-title">Архивы Вестероса</h1>
                <p style="text-align: center; font-style: italic;">Выберите запись для изучения:</p>
                <div id="items-list"></div>
            </div>

            <div class="page right-page">
                <div id="details-container">
                    <h2 class="archives-subtitle" style="color: var(--ink-color); opacity: 0.5; margin-top: 100px; border-bottom: none;">
                        Выберите запись слева,<br>чтобы открыть досье
                    </h2>
                </div>
            </div>
        </div>
    </div>

<script>
    // =========================================
    // === ЛОГИКА ПЕРЕКЛЮЧЕНИЯ ЭКРАНОВ ===
    // =========================================
    let isTrainerActive = true;

    function toggleViews() {
        const trainerView = document.getElementById('trainer-view');
        const archivesView = document.getElementById('archives-view');
        const toggleBtn = document.getElementById('global-toggle-btn');
        
        if (isTrainerActive) {
            // Переход в Архивы
            trainerView.style.display = 'none';
            archivesView.style.display = 'flex';
            document.body.className = 'archives-theme';
            toggleBtn.innerHTML = '⚔️ Вернуться к Тренажеру';
            isTrainerActive = false;
        } else {
            // Переход в Тренажер
            archivesView.style.display = 'none';
            trainerView.style.display = 'flex';
            document.body.className = 'trainer-theme';
            toggleBtn.innerHTML = '📚 Открыть Архивы Цитадели';
            isTrainerActive = true;
        }
    }

    function initDeck() {
        questionDeck = Array.from({length: database.length}, (_, i) => i);
        for (let i = questionDeck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [questionDeck[i], questionDeck[j]] = [questionDeck[j], questionDeck[i]];
        }
    }

    function selectBestVoice() {
        if (!('speechSynthesis' in window)) return null;
        const voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return null;

        const priorityList = [
            v => (v.name.includes('Microsoft') && v.name.includes('Natural') && v.lang.startsWith('en')),
            v => (v.name.includes('Google') && v.name.includes('Wavenet') && v.lang.startsWith('en')),
            v => (v.name.includes('Google UK') && v.lang.startsWith('en')),
            v => (v.name.includes('Google US') && v.lang.startsWith('en')),
            v => (v.name === 'Samantha' || v.name === 'Daniel' || v.name === 'Alex'),
            v => (v.name.includes('Microsoft') && (v.name.includes('David') || v.name.includes('Mark') || v.name.includes('Zira'))),
            v => v.lang.startsWith('en')
        ];

        for (let condition of priorityList) {
            const found = voices.find(condition);
            if (found) return found;
        }
        return voices[0];
    }

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = function() {
            preferredVoice = selectBestVoice();
        };
        setTimeout(() => {
            if (!preferredVoice) {
                preferredVoice = selectBestVoice();
            }
        }, 100);
    }

    function speak(text) {
        if (!('speechSynthesis' in window)) {
            alert('Ваш браузер не поддерживает синтез речи.');
            return;
        }

        window.speechSynthesis.cancel();
        let processedText = text
            .replace(/\bIV\b/g, ' the Fourth ')
            .replace(/\bIII\b/g, ' the Third ')
            .replace(/\bII\b/g, ' the Second ')
            .replace(/\bI\b/g, ' the First ');

        const words = processedText.split(' ');
        const phoneticWords = words.map(word => {
            const clean = word.replace(/[,\/#!$%\^&\*;:{}=\-_`~()]/g, '').toLowerCase();
            if (phoneticDict[clean]) {
                return phoneticDict[clean];
            }
            return word;
        });

        const utteranceText = phoneticWords.join(' ');
        const utterance = new SpeechSynthesisUtterance(utteranceText);
        utterance.lang = 'en-US';
        
        if (preferredVoice) {
            utterance.voice = preferredVoice;
        } else {
            preferredVoice = selectBestVoice();
            if (preferredVoice) {
                utterance.voice = preferredVoice;
            }
        }

        utterance.rate = 0.85;
        utterance.pitch = 1.0;
        utterance.volume = 1.0;
        utterance.onerror = (event) => console.error('Ошибка озвучки:', event.error);
        window.speechSynthesis.speak(utterance);
    }

    function setMode(mode, event) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));

        const label = document.getElementById('task-label');
        if (mode === 'transformation') {
            label.textContent = "Определите трансформацию";
        } else {
            label.textContent = "Определите тип имени собственного";

    }

            return;

        const index = questionDeck.pop();

        const originalDiv = document.getElementById('original');
        originalDiv.innerHTML = `<span>${currentItem.orig}</span><button class="speak-btn" id="speak-btn">🔊</button>`;
        
        document.getElementById('speak-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            speak(currentItem.orig);
        });
        
        document.getElementById('translation').textContent = currentItem.trans;
        renderOptions();
    }

    function renderOptions() {
        const container = document.getElementById('options');
        container.innerHTML = "";
        let options = [];

        if (currentMode === 'transformation') {
            const correct = currentItem.type;
            const groupTTT = ["Transcription", "Transliteration", "Transference"];
            const groupMC = ["Calque", "Modulation"];
            
            if (groupTTT.includes(correct)) {
                options = ["Transcription", "Transliteration", "Transference"];
                const fillers = ["Calque", "Modulation", "HalfCalque"];
                options.push(fillers[Math.floor(Math.random() * fillers.length)]);
            } 
            else if (groupMC.includes(correct)) {
                options = ["Calque", "Modulation", "HalfCalque"];
                options.push(groupTTT[Math.floor(Math.random() * groupTTT.length)]);
            } 
            else {
                options = [correct];
                const allTypes = ["Transcription", "Transliteration", "Transference", "Calque", "Modulation", "HalfCalque"];
                while (options.length < 4) {
                    const r = allTypes[Math.floor(Math.random() * allTypes.length)];
                    if (!options.includes(r)) options.push(r);
                }
            }
        } else {
            const correct = currentItem.cat;
            options = [correct];
            const allCats = ["Anthroponyms", "Toponyms", "Ethnonyms", "Titles"];
            
            while (options.length < 4) {
                const r = allCats[Math.floor(Math.random() * allCats.length)];
                if (!options.includes(r)) options.push(r);
            }
        }

        options.sort(() => Math.random() - 0.5);

        options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = dict[opt] || opt;
            btn.onclick = () => checkAnswer(opt, btn);
            container.appendChild(btn);
        });
    }

    function checkAnswer(selected, btn) {
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);
        
        total++;
        let isCorrect = false;
        let correctVal = "";

        if (currentMode === 'transformation') {
            isCorrect = (selected === currentItem.type);
            correctVal = dict[currentItem.type];
        } else {
            isCorrect = (selected === currentItem.cat);
            correctVal = dict[currentItem.cat] || currentItem.cat;
        }

        const feedback = document.getElementById('feedback');

        if (isCorrect) {
            score++;
            btn.classList.add('correct');
            feedback.textContent = "Дракарис! Верный ответ.";
            feedback.style.color = "#4caf50";
        } else {
            btn.classList.add('wrong');
            feedback.textContent = `Ошибка. Верно: ${correctVal}`;
            feedback.style.color = "#ff5252";
            
            document.querySelectorAll('.option-btn').forEach(b => {
                if (b.textContent === correctVal) b.classList.add('correct');
            });
        }

        document.getElementById('score').textContent = `Счет: ${score}`;
        document.getElementById('total').textContent = `Всего: ${total}`;
        document.getElementById('next-btn').style.display = "block";
    }

    nextQuestion();
